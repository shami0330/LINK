<!DOCTYPE html>
<html lang="fa" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000"><title>Link</title>
<style>
/* [CSS-BASE] پایه و رنگ‌ها | Base & colors */
:root{--ac:#3e88f7;--out:#7b5af0;--in:#2b2533;--sub:#8e8e93;--e:cubic-bezier(.2,.8,.2,1);
/* [SAFE-AREA] ۵ پیکسل پایین‌تر از حاشیه امن | 5px below bottom safe area */
--sb:max(0px,calc(env(safe-area-inset-bottom) - 5px))}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font:16px -apple-system,system-ui,sans-serif;direction:ltr;text-align:left;overscroll-behavior:none}
#app{position:fixed;inset:0}
#v{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 8px) 12px 110px}
.hd{display:flex;align-items:center;justify-content:space-between;height:48px}
.ci,.pill{background:#1c1c1e;border-radius:24px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;border:0;color:#fff;font:inherit;font-size:20px}
.pill{flex-direction:column;padding:0 24px;font-size:16px}
.sr{background:#1c1c1e;border-radius:22px;height:40px;margin:8px 0;padding:0 14px}
.sr input{background:none;border:0;color:#fff;font:inherit;outline:0;width:100%;height:100%}
.row{display:flex;gap:12px;padding:10px 4px;align-items:center;border-bottom:.5px solid #222;content-visibility:auto;contain-intrinsic-size:auto 68px}
.row:active{background:#1c1c1e}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:600 20px system-ui;flex:none;color:#fff}
.av.sm{width:44px;height:44px;font-size:17px}.av.xl{width:96px;height:96px;font-size:38px;margin:auto}
.mid{flex:1;min-width:0}.mid b,.mid span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid span{color:var(--sub);font-size:15px;margin-top:2px}
.rt{text-align:right;color:var(--sub);font-size:13px}
.bd{background:var(--ac);color:#fff;border-radius:11px;min-width:22px;padding:1px 7px;font-size:13px;display:inline-block;margin-top:4px;font-style:normal}
.em{color:var(--sub);text-align:center;margin-top:40px}
#tb{position:absolute;left:12px;right:12px;bottom:var(--sb);display:flex;gap:10px;z-index:5}
#tb nav{flex:1;display:flex;background:#1c1c1e;border-radius:32px;padding:6px}
.t{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:6px 0;border-radius:26px;color:#fff;background:none;border:0}
.t.on{background:#2c2c2e;color:var(--ac)}.t svg{width:26px;height:26px;fill:currentColor}
.cd{background:#1c1c1e;border-radius:20px;margin:14px 0;padding:4px 14px}.cd .row{border:0;justify-content:space-between}
.sg{display:flex;background:#2c2c2e;border-radius:10px;padding:2px}
.sg button{border:0;background:none;color:#fff;padding:6px 12px;border-radius:8px;font:inherit}.sg .on{background:var(--ac)}
/* [CSS-PAGES] صفحه‌های لغزان | Sliding pages */
.pg{position:absolute;inset:0;background:#000;transform:translateX(100%);transition:transform .22s var(--e);display:flex;flex-direction:column;z-index:9;will-change:transform}
.pg.on{transform:none}
#ms{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:4px;background:#0a0710}
.b{max-width:78%;padding:7px 11px;border-radius:18px;animation:pop .2s var(--e) both;word-break:break-word}
.b.i{background:var(--in);align-self:flex-start;border-bottom-left-radius:6px}
.b.o{background:var(--out);align-self:flex-end;border-bottom-right-radius:6px}
.b s{display:block;text-align:right;font-size:11px;opacity:.6;text-decoration:none}
.b q{display:block;border-left:3px solid #fff8;padding-left:8px;margin-bottom:4px;font-size:14px;opacity:.85;quotes:none}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.rbar{padding:6px 14px;background:#1c1c1e;color:var(--sub);font-size:14px}
#cp{display:flex;gap:8px;padding:8px 10px calc(var(--sb) + 4px)}
#cp input{flex:1;height:44px;border-radius:22px;border:0;background:#1c1c1e;color:#fff;padding:0 16px;font:inherit;outline:0}
#au{justify-content:center;align-items:center}
.ctr{display:flex;flex-direction:column;gap:12px;padding:24px;width:100%;max-width:380px}
.ctr input,.bt{height:48px;border-radius:14px;border:0;font:inherit;padding:0 14px;background:#1c1c1e;color:#fff}
.bt{background:var(--ac);font-weight:600}.bt.g{background:#2c2c2e}#er{color:#ff453a;font-size:14px}
</style></head><body>
<div id="app"><div id="v"></div><div id="tb"></div><div id="ch" class="pg"></div><div id="au" class="pg"></div></div>
<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
<script>
/* ===== [CONFIG] تنظیمات سرور | Server config ===== */
const EP='https://fra.cloud.appwrite.io/v1',PJ='6aecbdce0036439c36ca',DB='tg';
const {Client,Account,Databases,ID,Query}=Appwrite;
const cl=new Client().setEndpoint(EP).setProject(PJ),acc=new Account(cl),db=new Databases(cl);
const $=s=>document.querySelector(s),ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
const S={me:0,pf:{},ch:[],ms:[],cur:0,tab:'chats',rp:0,un:{},q:''};
let L=ls('lang')||'fa',FPS=+ls('fps')||60;

/* ===== [I18N] زبان‌ها | Languages (layout always LTR) ===== */
const T={fa:{chats:'گفتگوها',contacts:'مخاطبین',settings:'تنظیمات',msg:'پیام',login:'ورود / ثبت‌نام',id:'ایمیل یا نام کاربری',pw:'رمز عبور (حداقل ۸ حرف)',guest:'ورود مهمان',out:'خروج از حساب',name:'نام',un:'نام کاربری',ap:'ظاهر برنامه',lang:'زبان',fps:'نرخ فریم',on:'آنلاین',seen:'آخرین بازدید',min:'دقیقه پیش',hr:'ساعت پیش',yd:'بازدید دیروز',lg:'آخرین بازدید خیلی وقت پیش',no:'گفتگویی نیست',se:'جستجو',wp:'رمز عبور اشتباه است',mem:'عضو'},
en:{chats:'Chats',contacts:'Contacts',settings:'Settings',msg:'Message',login:'Log in / Sign up',id:'Email or username',pw:'Password (min 8)',guest:'Continue as guest',out:'Log out',name:'Name',un:'Username',ap:'Appearance',lang:'Language',fps:'Frame rate',on:'online',seen:'last seen',min:'min ago',hr:'h ago',yd:'last seen yesterday',lg:'last seen long ago',no:'No chats yet',se:'Search',wp:'Wrong password',mem:'members'}};
const t=k=>T[L][k];

/* ===== [FPS] نرخ فریم ۳۰/۶۰ | 30/60 fps (30 = stepped animations, lighter) ===== */
const fx=()=>document.documentElement.style.setProperty('--e',FPS==30?'steps(7,end)':'cubic-bezier(.2,.8,.2,1)');

/* ===== [UTIL] ابزارها | Helpers ===== */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=s=>{let h=0;for(const c of s)h=h*31+c.charCodeAt(0)|0;return`hsl(${Math.abs(h)%360} 50% 45%)`};
const av=(n,z='')=>`<i class="av ${z}" style="background:${col(n)}">${esc([...n][0]||'?')}</i>`;
const lc=()=>L=='fa'?'fa-IR':'en-GB',nm=n=>n.toLocaleString(lc());
const tm=ms=>new Date(ms).toLocaleTimeString(lc(),{hour:'2-digit',minute:'2-digit',hour12:false});
/* [PRESENCE] آنلاین/آخرین بازدید | online & last seen */
function sn(ms){if(!ms)return t('lg');const d=Date.now()-ms;if(d<45e3)return t('on');const m=Math.max(1,Math.round(d/6e4));if(m<60)return`${t('seen')} ${nm(m)} ${t('min')}`;const h=Math.floor(m/60);if(h<24)return`${t('seen')} ${nm(h)} ${t('hr')}`;const x=new Date(ms);return x.toDateString()==new Date(Date.now()-864e5).toDateString()?t('yd'):`${t('seen')} ${x.toLocaleDateString(lc())}`}
const pr=u=>S.pf[u]||{name:'?',username:'',seen:0};
const peer=c=>c.members.find(x=>x!=S.me.$id)||S.me.$id;
const nmOf=c=>c.type=='dm'?pr(peer(c)).name:c.title;

/* ===== [AUTH] ورود / مهمان / خروج | Login, guest, logout ===== */
function authUI(){$('#au').innerHTML=`<div class="ctr"><h2 style="text-align:center">Link</h2><input id="ai" placeholder="${t('id')}" autocapitalize="off"><input id="ap" type="password" placeholder="${t('pw')}"><button class="bt" onclick="go()">${t('login')}</button><button class="bt g" onclick="gs()">${t('guest')}</button><p id="er"></p></div>`;$('#au').classList.add('on')}
async function go(){const id=$('#ai').value.trim(),pw=$('#ap').value;if(!id||!pw)return;const em=id.includes('@')?id:id+'@link.app';
try{try{await acc.createEmailPasswordSession(em,pw)}catch(e){if(e.code!=401)throw e;try{await acc.create(ID.unique(),em,pw,id.split('@')[0])}catch(x){throw x.code==409?Error(t('wp')):x}await acc.createEmailPasswordSession(em,pw)}await start()}catch(e){$('#er').textContent=e.message}}
async function gs(){try{await acc.createAnonymousSession();await start()}catch(e){$('#er').textContent=e.message}}
async function lo(){try{await acc.deleteSession('current')}catch(e){}location.reload()}

/* ===== [DATA] بارگذاری داده | Load profile, chats, contacts ===== */
async function start(){S.me=await acc.get();let p;
try{p=await db.getDocument(DB,'profiles',S.me.$id)}catch(e){
const base=S.me.email?S.me.email.split('@')[0].replace(/\W/g,'').slice(0,20):'guest'+Math.random().toString(36).slice(2,6);
const mk=u=>db.createDocument(DB,'profiles',S.me.$id,{name:S.me.name||base,username:u,seen:Date.now()});
try{p=await mk(base)}catch(x){p=await mk(base+Math.random().toString(36).slice(2,6))}}
S.pf[p.$id]=p;$('#au').classList.remove('on');
const [a,b]=await Promise.all([db.listDocuments(DB,'chats',[Query.contains('members',S.me.$id),Query.limit(100)]),db.listDocuments(DB,'profiles',[Query.limit(100)])]);
S.ch=a.documents;b.documents.forEach(x=>S.pf[x.$id]=x);R();rt();ping()}
const ping=()=>S.me&&!document.hidden&&db.updateDocument(DB,'profiles',S.me.$id,{seen:Date.now()}).catch(()=>{});
setInterval(ping,25e3);document.addEventListener('visibilitychange',ping);

/* ===== [REALTIME] دریافت زنده | Live receive ===== */
function rt(){cl.subscribe([`databases.${DB}.collections.messages.documents`,`databases.${DB}.collections.chats.documents`,`databases.${DB}.collections.profiles.documents`],r=>{
const d=r.payload,e=r.events[0]||'';
if(e.includes('.profiles.')){S.pf[d.$id]=d;RL();return}
if(e.includes('.chats.')){if(!d.members.includes(S.me.$id))return;const i=S.ch.findIndex(c=>c.$id==d.$id);i<0?S.ch.push(d):S.ch[i]=d;if(S.cur&&S.cur.$id==d.$id)S.cur=d;RL();return}
if(!S.ch.some(c=>c.$id==d.chat)||S.ms.some(x=>x.$id==d.$id))return;
if(S.cur&&S.cur.$id==d.chat){S.ms.push(d);drawMs()}else if(d.uid!=S.me.$id){S.un[d.chat]=(S.un[d.chat]||0)+1;RL()}})}

/* ===== [UI-MAIN] صفحه اصلی و تب‌ها | Main screen & tab bar ===== */
const IC={contacts:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6z"/></svg>',chats:'<svg viewBox="0 0 24 24"><path d="M4 4h16v13H9l-5 4z"/></svg>',settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>'};
const hd=(a,b,c)=>`<div class="hd"><i style="width:44px"></i><b>${a}</b>${b?`<button class="ci" onclick="${c}">${b}</button>`:'<i style="width:44px"></i>'}</div>`;
const tab=k=>{S.tab=k;S.q='';R()};
function R(){const k=S.tab;
$('#v').innerHTML=k=='settings'?hd(t('settings'))+rS():hd(t(k),k=='chats'?'✎':'',"tab('contacts')")+`<div class="sr"><input id="qi" placeholder="${t('se')}" oninput="S.q=this.value;RL()"></div><div id="ls"></div>`;
RL();
$('#tb').innerHTML=`<nav>${['contacts','chats','settings'].map(x=>`<button class="t ${x==k?'on':''}" onclick="tab('${x}')">${IC[x]}${t(x)}</button>`).join('')}</nav><button class="ci" onclick="tab('chats');$('#qi').focus()">⌕</button>`}

/* [UI-LIST] لیست گفتگوها و مخاطبین | Chat & contact lists */
const rowC=c=>{const n=nmOf(c),u=S.un[c.$id];return`<div class="row" onclick="openC('${c.$id}')">${av(n)}<div class="mid"><b>${esc(n)}</b><span dir="auto">${esc(c.last||'')}</span></div><div class="rt">${c.ts?tm(c.ts):''}${u?`<br><i class="bd">${nm(u)}</i>`:''}</div></div>`};
const rowU=p=>`<div class="row" onclick="dm('${p.$id}')">${av(p.name)}<div class="mid"><b>${esc(p.name)}</b><span>${sn(p.seen)}</span></div></div>`;
function RL(){const l=$('#ls');if(!l)return;const q=S.q.toLowerCase();
l.innerHTML=S.tab=='chats'?(S.ch.filter(c=>nmOf(c).toLowerCase().includes(q)).sort((a,b)=>b.ts-a.ts).map(rowC).join('')||`<p class="em">${t('no')}</p>`):Object.values(S.pf).filter(p=>p.$id!=S.me.$id&&(p.name+p.username).toLowerCase().includes(q)).map(rowU).join('')}

/* ===== [UI-SETTINGS] تنظیمات: نام، نام کاربری، ظاهر، خروج | Settings ===== */
const seg=(k,a,v)=>`<span class="sg">${a.map(x=>`<button class="${x==v?'on':''}" onclick="st('${k}','${x}')">${x=='fa'?'فارسی':x=='en'?'English':x}</button>`).join('')}</span>`;
const rS=()=>{const p=pr(S.me.$id);return`<div style="text-align:center;padding:20px 0">${av(p.name,'xl')}<h2 style="margin:8px 0">${esc(p.name)}</h2><p style="color:var(--sub)">@${esc(p.username)}</p></div>
<div class="cd"><div class="row" onclick="ed('name')"><b>${t('name')}</b><span class="rt">${esc(p.name)}</span></div><div class="row" onclick="ed('username')"><b>${t('un')}</b><span class="rt">@${esc(p.username)}</span></div></div>
<div class="cd"><div class="row"><b>${t('fps')}</b>${seg('fps',[30,60],FPS)}</div><div class="row"><b>${t('lang')}</b>${seg('lang',['fa','en'],L)}</div></div>
<div class="cd"><div class="row" onclick="lo()" style="color:#ff453a"><b>${t('out')}</b></div></div>`};
function st(k,v){if(k=='fps'){FPS=+v;ls('fps',v);fx()}else{L=v;ls('lang',v)}R()}
async function ed(f){const v=prompt(t(f=='name'?'name':'un'),pr(S.me.$id)[f]);if(!v)return;let x=v.trim();if(f=='username')x=x.replace(/\W/g,'');if(!x)return;
try{S.pf[S.me.$id]=await db.updateDocument(DB,'profiles',S.me.$id,{[f]:x});if(f=='name')acc.updateName(x)}catch(e){alert(e.message)}R()}

/* ===== [UI-CHAT] صفحه گفتگو: ارسال، ریپلای | Chat page: send, reply ===== */
async function dm(u){let c=S.ch.find(c=>c.type=='dm'&&c.members.includes(u));
if(!c){c=await db.createDocument(DB,'chats',ID.unique(),{type:'dm',title:'',members:[S.me.$id,u],owner:S.me.$id,last:'',ts:Date.now()});S.ch.push(c)}
tab('chats');openC(c.$id)}
async function openC(id){S.cur=S.ch.find(c=>c.$id==id);S.rp=0;S.un[id]=0;S.ms=[];drawChat();$('#ch').classList.add('on');
const r=await db.listDocuments(DB,'messages',[Query.equal('chat',id),Query.orderDesc('ts'),Query.limit(60)]);S.ms=r.documents.reverse();drawMs()}
function drawChat(){const c=S.cur,n=nmOf(c),s=c.type=='dm'?sn(pr(peer(c)).seen):`${nm(c.members.length)} ${t('mem')}`;
$('#ch').innerHTML=`<div class="hd" style="padding:calc(env(safe-area-inset-top) + 8px) 12px 4px;height:auto"><button class="ci" onclick="back()">‹</button><div class="pill"><b>${esc(n)}</b><small style="color:var(--sub)">${s}</small></div>${av(n,'sm')}</div><div id="ms"></div><div id="rb"></div><div id="cp"><input id="in" dir="auto" placeholder="${t('msg')}" onkeydown="event.key=='Enter'&&send()"><button class="ci" style="background:var(--ac)" onclick="send()">➤</button></div>`}
const bub=m=>{const o=m.uid==S.me.$id,r=m.reply&&S.ms.find(x=>x.$id==m.reply);return`<div class="b ${o?'o':'i'}" onclick="rp('${m.$id}')">${r?`<q dir="auto">${esc(r.text)}</q>`:''}<p dir="auto">${esc(m.text)}</p><s>${tm(m.ts)}${o?' ✓':''}</s></div>`};
function drawMs(){const m=$('#ms');if(!m)return;m.innerHTML=S.ms.map(bub).join('');m.scrollTop=m.scrollHeight}
function rp(id){if(!id){S.rp=0;$('#rb').innerHTML='';return}S.rp=id;const m=S.ms.find(x=>x.$id==id);$('#rb').innerHTML=`<div class="rbar" dir="auto" onclick="rp(0)">↩ ${esc((m.text||'').slice(0,60))} ✕</div>`;$('#in').focus()}
async function send(){const i=$('#in'),v=i.value.trim();if(!v)return;i.value='';
const id=ID.unique(),m={chat:S.cur.$id,uid:S.me.$id,text:v,kind:'text',reply:S.rp||'',ts:Date.now()};
S.ms.push({...m,$id:id});S.cur.last=v.slice(0,80);S.cur.ts=m.ts;rp(0);drawMs();
try{await db.createDocument(DB,'messages',id,m);await db.updateDocument(DB,'chats',m.chat,{last:S.cur.last,ts:m.ts})}catch(e){alert(e.message)}}
function back(){$('#ch').classList.remove('on');S.cur=0;R()}

/* ===== [BOOT] شروع | Start ===== */
fx();(async()=>{let ok=1;try{await acc.get()}catch(e){ok=0}
ok?start().catch(e=>{authUI();$('#er').textContent=e.message}):authUI()})();
</script></body></html>
