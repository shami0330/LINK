<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>realtime link</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2/dist/iife/sdk.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
:root{--ac:#3390ec;--ac2:#7b61ff;--vh:100dvh}
html,body{height:100%;overflow:hidden;font-family:Vazirmatn,Tahoma,sans-serif;background:#eaf2ff;color:#1c2733}
#app{position:fixed;inset:0;height:var(--vh);overflow:hidden;background:linear-gradient(160deg,#e8f1ff,#f3e9ff 60%,#e6fbf3)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:fl 14s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:#8ec5ff;top:-90px;right:-80px}
.b2{width:300px;height:300px;background:#c9a8ff;bottom:-80px;left:-60px;animation-delay:-5s}
.b3{width:220px;height:220px;background:#9bf2d0;top:45%;left:30%;animation-delay:-9s}
@keyframes fl{to{transform:translate(40px,-50px) scale(1.2)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .45s}
.screen.off{opacity:0;pointer-events:none}
#login.off{transform:scale(.94) translateY(-20px)}
#list.off{transform:translateX(25%)}
#chat.off{transform:translateX(-100%)}
/* login */
#login{align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:360px;padding:34px 26px;border-radius:30px;background:rgba(255,255,255,.65);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 20px 60px rgba(80,90,200,.18);text-align:center;animation:rise .9s cubic-bezier(.2,1.2,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.9)}}
.logo{width:84px;height:84px;margin:0 auto 16px;border-radius:26px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 12px 30px rgba(80,100,240,.4);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07) rotate(-4deg)}}
.logo svg{width:44px;height:44px}
h1{font-size:26px;font-weight:800;letter-spacing:.5px;direction:ltr}
.sub{color:#6b7b8c;font-size:14px;margin:6px 0 22px}
input.name{width:100%;padding:15px 18px;border:2px solid transparent;border-radius:18px;background:#fff;font:inherit;font-size:16px;text-align:center;outline:0;box-shadow:0 4px 16px rgba(0,0,0,.05);transition:.3s}
input.name:focus{border-color:var(--ac);box-shadow:0 0 0 6px rgba(51,144,236,.15);transform:scale(1.02)}
.btn{margin-top:14px;width:100%;padding:15px;border:0;border-radius:18px;font:inherit;font-weight:600;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer;box-shadow:0 10px 24px rgba(80,100,240,.35);transition:transform .25s cubic-bezier(.2,1.5,.4,1),box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(80,100,240,.45)}
.btn:active{transform:scale(.95)}
.btn.load{opacity:.7;pointer-events:none}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* list */
.top{padding:max(16px,env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;justify-content:space-between}
.top h2{font-size:22px;font-weight:800;direction:ltr}
.me{font-size:13px;color:#6b7b8c}
.out{border:0;background:rgba(255,255,255,.7);padding:8px 14px;border-radius:14px;font:inherit;font-size:13px;color:#e0485a;cursor:pointer;transition:.25s}
.out:active{transform:scale(.92)}
#users{flex:1;overflow:auto;padding:6px 14px 20px}
.u{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:10px;border-radius:22px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);cursor:pointer;box-shadow:0 4px 14px rgba(60,80,160,.07);animation:up .6s cubic-bezier(.2,1,.3,1) both;animation-delay:calc(var(--i,0)*70ms);transition:transform .25s cubic-bezier(.2,1.5,.4,1),box-shadow .25s}
.u:hover{transform:translateX(-4px) scale(1.01);box-shadow:0 8px 22px rgba(60,80,160,.14)}
.u:active{transform:scale(.96)}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.95)}}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.u b{display:block;font-size:16px}.u small{color:#8a97a5;font-size:12px}
.empty{text-align:center;color:#8a97a5;margin-top:60px;animation:up .8s both}
/* chat */
#chat{background:linear-gradient(170deg,#c9e6d0,#bcd9e8 55%,#cfc6ea)}
.ch{display:flex;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.back{width:40px;height:40px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;transition:.25s}
.back:active{background:#0001;transform:scale(.88)}
.ch .av{width:42px;height:42px;font-size:17px}
.ch b{font-size:16px}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;direction:ltr}
.row{display:flex;flex-direction:column;max-width:80%}
.row.me{align-self:flex-end;align-items:flex-end}
.row.you{align-self:flex-start;align-items:flex-start}
.bb{padding:8px 13px;border-radius:18px;font-size:16px;line-height:1.7;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 3px rgba(0,0,0,.12);animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;unicode-bidi:plaintext}
.me .bb{background:#eeffde;border-bottom-right-radius:5px;transform-origin:bottom right}
.you .bb{background:#fff;border-bottom-left-radius:5px;transform-origin:bottom left}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.6)}}
#liveRow{display:none}
#liveRow.on{display:flex}
#liveRow .bb{background:linear-gradient(135deg,#fff,#f1f6ff);box-shadow:0 2px 14px rgba(123,97,255,.3);animation:livein .6s cubic-bezier(.2,1.6,.4,1) both}
#liveRow .bb.bump{animation:bump .3s cubic-bezier(.2,1.8,.4,1)}
@keyframes livein{from{opacity:0;transform:translateY(34px) scale(.4);filter:blur(8px)}}
@keyframes bump{0%{transform:scale(.96)}60%{transform:scale(1.03)}}
.n{animation:glow .7s ease-out both}
@keyframes glow{from{color:var(--ac2);text-shadow:0 0 12px var(--ac2)}to{color:inherit;text-shadow:0 0 0 transparent}}
.cur{display:inline-block;width:2px;height:1em;background:var(--ac2);margin:0 2px;vertical-align:text-bottom;animation:bl 1s infinite}
@keyframes bl{50%{opacity:0}}
.bar{display:flex;align-items:flex-end;gap:8px;padding:8px 10px max(8px,env(safe-area-inset-bottom));background:rgba(255,255,255,.9)}
#inp{flex:1;border:0;outline:0;background:#f0f3f7;border-radius:22px;padding:11px 16px;font:inherit;font-size:16px;max-height:120px;transition:box-shadow .3s}
#inp:focus{box-shadow:0 0 0 3px rgba(51,144,236,.25)}
#go{width:44px;height:44px;border:0;border-radius:50%;background:var(--ac);display:grid;place-items:center;cursor:pointer;flex:none;transform:scale(0);opacity:0;transition:transform .35s cubic-bezier(.2,1.8,.4,1),opacity .2s}
#go.on{transform:scale(1);opacity:1}
#go:active{transform:scale(.88)}
#go svg{width:22px;height:22px;transform:scaleX(-1)}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-90px);background:#2b3540;color:#fff;padding:12px 18px;border-radius:16px;font-size:13px;max-width:90%;transition:transform .5s cubic-bezier(.2,1.4,.4,1);z-index:9;direction:ltr;text-align:left}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div id="login" class="screen off">
 <div class="card">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg></div>
  <h1>realtime link</h1>
  <p class="sub">فقط یه اسم بنویس و وارد شو</p>
  <input id="nm" class="name" maxlength="24" placeholder="اسمت چیه؟" autocomplete="off">
  <button id="lg" class="btn">ورود مهمان</button>
 </div>
</div>

<div id="list" class="screen off">
 <div class="top"><div><h2>realtime link</h2><div class="me" id="meName"></div></div><button class="out" id="lo">خروج</button></div>
 <div id="users"></div>
</div>

<div id="chat" class="screen off">
 <div class="ch">
  <button class="back" id="bk"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3390ec" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  <div class="av" id="pav"></div><b id="pnm"></b>
 </div>
 <div id="msgs">
  <div class="row you" id="liveRow"><div class="bb" id="liveB"><span id="ls"></span><i class="cur"></i></div></div>
 </div>
 <div class="bar">
  <button id="go"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3.4 20.4l17.5-7.5a1 1 0 0 0 0-1.8L3.4 3.6a1 1 0 0 0-1.4 1.2L4 11l9 1-9 1-2 6.2a1 1 0 0 0 1.4 1.2z"/></svg></button>
  <input id="inp" placeholder="پیام..." maxlength="1000" autocomplete="off">
 </div>
</div>
</div>
<div id="toast"></div>

<script>
const EP='https://fra.cloud.appwrite.io/v1',PID='6aecbdce0036439c36ca',DB='rtlink';
const {Client,Account,Databases,ID,Query,Permission,Role}=Appwrite;
const client=new Client().setEndpoint(EP).setProject(PID);
const account=new Account(client),db=new Databases(client);
const $=id=>document.getElementById(id);
let me=null,peer=null,key='',users=new Map(),rows=new Map(),msgIds=new Set(),shown='',subbed=false;

/* viewport (keyboard) */
const vv=window.visualViewport;
function fit(){if(vv){document.documentElement.style.setProperty('--vh',vv.height+'px');window.scrollTo(0,0);scrollDown()}}
if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);fit()}

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),5000)}
const err=e=>{console.error(e);toast((e&&e.message)||String(e))};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const avStyle=(el,u)=>{el.textContent=[...u.name][0]||'?';el.style.background=`linear-gradient(135deg,hsl(${hue(u.id)},75%,62%),hsl(${(hue(u.id)+50)%360},75%,55%))`};
function show(n){['login','list','chat'].forEach(s=>$(s).classList.toggle('off',s!==n))}
function scrollDown(){const m=$('msgs');m.scrollTo({top:m.scrollHeight,behavior:'smooth'})}

/* login */
async function login(){
  const name=$('nm').value.trim();
  if(!name){const c=$('nm');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');return}
  $('lg').classList.add('load');
  try{
    let u;
    try{u=await account.get()}catch(_){await account.createAnonymousSession();u=await account.get()}
    if(u.name!==name)u=await account.updateName(name);
    await enter(u);
  }catch(e){err(e)}
  $('lg').classList.remove('load');
}
async function enter(u){
  me={id:u.$id,name:u.name};
  const perms=[Permission.read(Role.users()),Permission.update(Role.user(me.id)),Permission.delete(Role.user(me.id))];
  try{await db.updateDocument(DB,'users',me.id,{name:me.name})}
  catch(_){await db.createDocument(DB,'users',me.id,{name:me.name},perms)}
  $('meName').textContent=me.name;
  const r=await db.listDocuments(DB,'users',[Query.limit(100)]);
  r.documents.forEach(d=>users.set(d.$id,{id:d.$id,name:d.name}));
  renderList();subscribe();show('list');
}
$('lg').onclick=login;
$('nm').onkeydown=e=>{if(e.key==='Enter')login()};
$('lo').onclick=async()=>{try{await account.deleteSession('current')}catch(_){}location.reload()};

/* list */
function renderList(){
  const box=$('users');
  const arr=[...users.values()].filter(u=>u.id!==me.id).sort((a,b)=>a.name.localeCompare(b.name,'fa'));
  const emp=box.querySelector('.empty');
  if(!arr.length){if(!emp)box.innerHTML='<div class="empty">هنوز کسی ثبت‌نام نکرده 🌙<br>یه تب دیگه با اسم دیگه باز کن</div>';return}
  if(emp)emp.remove();
  arr.forEach((u,i)=>{
    let el=rows.get(u.id);
    if(!el){
      el=document.createElement('div');el.className='u';el.style.setProperty('--i',i);
      el.innerHTML='<div class="av"></div><div><b></b><small>برای گفتگو بزن</small></div>';
      el.onclick=()=>openChat(users.get(u.id));
      rows.set(u.id,el);
    }
    avStyle(el.querySelector('.av'),u);el.querySelector('b').textContent=u.name;
    box.appendChild(el);
  });
}

/* realtime */
function subscribe(){
  if(subbed)return;subbed=true;
  const c=n=>`databases.${DB}.collections.${n}.documents`;
  client.subscribe([c('users'),c('live'),c('messages')],r=>{
    const ev=r.events.join(' '),p=r.payload;
    if(ev.includes('.collections.users.')){
      if(p.$id!==me.id&&!ev.includes('.delete')){users.set(p.$id,{id:p.$id,name:p.name});renderList()}
    }else if(ev.includes('.collections.live.')){
      if(peer&&p.$id===peer.id&&!ev.includes('.delete'))setLive(p.to===me.id?p.text:'');
    }else if(ev.includes('.collections.messages.')){
      if(peer&&p.chat===key&&ev.includes('.create'))addMsg(p);
    }
  });
}

/* chat */
async function openChat(u){
  peer=u;key=[me.id,u.id].sort().join('_');
  avStyle($('pav'),u);$('pnm').textContent=u.name;
  [...$('msgs').querySelectorAll('.row:not(#liveRow)')].forEach(e=>e.remove());
  msgIds.clear();setLive('');$('inp').value='';upd();
  show('chat');
  try{
    const r=await db.listDocuments(DB,'messages',[Query.equal('chat',key),Query.orderAsc('$createdAt'),Query.limit(200)]);
    r.documents.forEach(addMsg);
    try{const l=await db.getDocument(DB,'live',u.id);
      if(l.to===me.id&&Date.now()-new Date(l.$updatedAt)<30000)setLive(l.text)}catch(_){}
  }catch(e){err(e)}
  setTimeout(()=>$('inp').focus(),500);
}
$('bk').onclick=()=>{sendDraft('','');peer=null;setLive('');show('list')};

function addMsg(d){
  if(msgIds.has(d.$id))return;msgIds.add(d.$id);
  const mine=d.from===me.id;
  const r=document.createElement('div');r.className='row '+(mine?'me':'you');
  const b=document.createElement('div');b.className='bb';b.textContent=d.text;r.appendChild(b);
  $('msgs').insertBefore(r,$('liveRow'));
  if(!mine)setLive('');
  scrollDown();
}

/* peer live bubble: char-by-char */
function setLive(t){
  t=t||'';const row=$('liveRow'),ls=$('ls'),b=$('liveB');
  if(!t){row.classList.remove('on');shown='';ls.textContent='';return}
  if(!row.classList.contains('on')){row.classList.add('on');shown='';ls.textContent='';b.style.animation='none';void b.offsetWidth;b.style.animation=''}
  const a=[...shown],n=[...t];let i=0;
  while(i<a.length&&i<n.length&&a[i]===n[i])i++;
  ls.textContent='';
  ls.append(document.createTextNode(n.slice(0,i).join('')));
  if(n.length>i){const s=document.createElement('span');s.className='n';s.textContent=n.slice(i).join('');ls.appendChild(s)}
  shown=t;
  b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');
  scrollDown();
}

/* my draft -> live doc */
let inflight=false,pending=null;
function sendDraft(text,to){pending={text,to};pump()}
async function pump(){
  if(inflight||!pending)return;inflight=true;const d=pending;pending=null;
  try{
    try{await db.updateDocument(DB,'live',me.id,{to:d.to,text:d.text})}
    catch(e){
      if(e.code===404)await db.createDocument(DB,'live',me.id,{to:d.to,text:d.text},[Permission.read(Role.users()),Permission.update(Role.user(me.id)),Permission.delete(Role.user(me.id))]);
      else throw e;
    }
  }catch(e){console.warn(e);if(!pump.warned){pump.warned=1;err(e)}}
  inflight=false;pump();
}
const inp=$('inp');
function upd(){$('go').classList.toggle('on',!!inp.value.trim())}
inp.addEventListener('input',()=>{upd();if(peer)sendDraft(inp.value,peer.id)});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});
$('go').addEventListener('pointerdown',e=>e.preventDefault());
$('go').onclick=send;
async function send(){
  const t=inp.value.trim();if(!t||!peer)return;
  inp.value='';upd();sendDraft('',peer.id);
  try{
    const d=await db.createDocument(DB,'messages',ID.unique(),{chat:key,from:me.id,to:peer.id,text:t},
      [Permission.read(Role.user(me.id)),Permission.read(Role.user(peer.id))]);
    addMsg(d);
  }catch(e){err(e)}
}

/* start */
(async()=>{
  try{const u=await account.get();if(u.name){await enter(u);return}}catch(_){}
  show('login');
})();
</script>
</body>
</html>
