<!doctype html><html lang=fa><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name=theme-color content=#000><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<title>Messenger</title><!-- Messenger v0.1 -->
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--kb:0px;--sb:max(0px,calc(env(safe-area-inset-bottom) - 3px));--bl:#4f8bf7;--s:#1c1c1e}
html,body{position:fixed;inset:0;overflow:hidden;background:#000;color:#fff;font:16px/1.3 -apple-system,system-ui,Vazirmatn,Tahoma,sans-serif;direction:ltr;text-align:left;overscroll-behavior:none}
#app{position:absolute;inset:0}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;background:#000;transform:translate3d(100%,0,0);visibility:hidden;transition:transform .2s cubic-bezier(.3,.7,.2,1),visibility 0s .2s}
.pg.on{transform:none;visibility:visible;transition:transform .2s cubic-bezier(.3,.7,.2,1),visibility 0s}
button,input,textarea{font:inherit;color:inherit;border:0;background:none;outline:0;text-align:inherit}
button{cursor:pointer}button:disabled{opacity:.4}
.hd{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 12px 8px;flex:none}
.cb{width:44px;height:44px;border-radius:50%;background:var(--s);display:grid;place-items:center;flex:none;font-weight:600;overflow:hidden}
.cp{flex:1;min-width:0;height:44px;border-radius:22px;background:var(--s);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;white-space:nowrap}
.cp input{text-align:left;width:100%;padding:0 16px;font-weight:400}
.sm{color:#8e8e93;font-size:12px;font-weight:400}
.rows{flex:1;overflow-y:auto;padding-bottom:100px}
.r{display:flex;gap:12px;padding:8px 16px;align-items:center}.r:active{background:var(--s)}
.r>div:nth-child(2){min-width:0;flex:1}.r b{display:block}
.r span{color:#8e8e93;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.r time{color:#8e8e93;font-size:14px;align-self:flex-start;padding-top:6px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:20px;flex:none}
#ca .av{width:44px;height:44px;font-size:18px}
.em{color:#8e8e93;text-align:center;padding:40px 24px}
#tb{position:absolute;left:16px;right:16px;bottom:calc(var(--sb) + 8px);height:62px;border-radius:31px;background:rgba(28,28,30,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;padding:5px}
#tb button{flex:1;border-radius:26px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#tb .a{background:#2c2c2e;color:var(--bl)}
svg{width:26px;height:26px;fill:currentColor}
#ms{flex:1;overflow-y:auto;display:flex;flex-direction:column-reverse;background:#0a0710}
#mi{display:flex;flex-direction:column;gap:4px;padding:8px 10px}
.m{max-width:80%;padding:7px 12px 6px;border-radius:18px;background:#2b2630;white-space:pre-wrap;word-break:break-word}
.m.o{align-self:flex-end;background:#6e5ae6}
.m span{unicode-bidi:plaintext}.m i{font-style:normal;font-size:11px;opacity:.6;margin-left:8px}
#bar{display:flex;align-items:flex-end;gap:8px;padding:6px 10px;flex:none}
#in{flex:1;display:block;background:var(--s);border-radius:22px;padding:11px 16px;min-height:44px;max-height:120px;resize:none;unicode-bidi:plaintext}
#sd{background:var(--bl);font-size:22px}
#sp{flex:none;height:max(var(--kb),var(--sb));transition:height .25s cubic-bezier(.2,.8,.2,1)}
#auth{align-items:center;justify-content:center;gap:12px;padding:24px;transform:none}
#auth input{width:100%;max-width:340px;background:var(--s);border-radius:14px;padding:14px 16px}
.bt{width:100%;max-width:340px;border-radius:14px;padding:14px;text-align:center;background:var(--bl);font-weight:600}
.bt.g{background:var(--s);color:var(--bl)}
#er{color:#ff6b6b;font-size:14px;max-width:340px}
</style></head><body><div id=app>
<section id=auth class="pg on">
<h1 data-i=ti></h1>
<input id=u data-p=u autocapitalize=none autocomplete=username>
<input id=p data-p=p type=password autocomplete=current-password>
<div id=er></div>
<button class=bt onclick=go() data-i=go></button>
<button class="bt g" onclick=go(1) data-i=g></button>
<button class=lg onclick=lgx()></button>
</section>
<section id=list class=pg>
<div class=hd><button class="cb lg" onclick=lgx()></button><div class=cp data-i=ch></div><button class=cb onclick=nc()>✎</button></div>
<div class=rows id=rows></div>
<div id=tb><button disabled><svg viewBox="0 0 24 24"><circle cx=12 cy=8 r=4 /><path d="M4 21c0-4 4-6 8-6s8 2 8 6z"/></svg><span data-i=co></span></button><button class=a><svg viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4z"/></svg><span data-i=ch></span></button><button disabled><svg viewBox="0 0 24 24"><circle cx=12 cy=12 r=7 fill=none stroke=currentColor stroke-width=4 /></svg><span data-i=se></span></button></div>
</section>
<section id=newc class=pg>
<div class=hd><button class=cb onclick="pg('newc',0)">✕</button><div class=cp><input id=q data-p=s oninput=ncr()></div></div>
<div class=rows id=ct></div>
</section>
<section id=chat class=pg>
<div class=hd><button class=cb onclick=back()>‹</button><div class=cp><span id=cn></span></div><div class=cb id=ca></div></div>
<div id=ms><div id=mi></div></div>
<div id=bar><button class=cb disabled><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2><path d="M16 7l-7 7a2 2 0 0 0 3 3l7-7a4 4 0 0 0-6-6l-7 7a6 6 0 0 0 9 9l5-5"/></svg></button><textarea id=in rows=1 data-p=m></textarea><button class=cb id=sd disabled onpointerdown=event.preventDefault() onclick=send()>↑</button></div>
<div id=sp></div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
<script>
const $=s=>document.querySelector(s),L=localStorage,D='msg',M='messages',U='users',H=document.documentElement;
const T={fa:{ti:'پیام‌رسان',u:'ایمیل یا نام کاربری',p:'رمز عبور',go:'ورود / ثبت‌نام',g:'ورود مهمان',ch:'گفتگوها',co:'مخاطبین',se:'تنظیمات',s:'جستجو',m:'پیام',e:'هنوز گفتگویی نیست. دکمه بالا را بزن'},
en:{ti:'Messenger',u:'Email or username',p:'Password',go:'Sign in / Sign up',g:'Continue as guest',ch:'Chats',co:'Contacts',se:'Settings',s:'Search',m:'Message',e:'No chats yet. Tap the button above'}};
const c=new Appwrite.Client().setEndpoint('https://fra.cloud.appwrite.io/v1').setProject('6aecbdce0036439c36ca');
const A=new Appwrite.Account(c),DB=new Appwrite.Databases(c),{ID,Query:Q,Permission:P,Role:R}=Appwrite;
let lang=L.lang||'fa',me,cur,all=new Map,us={};
const t=k=>T[lang][k],esc=s=>String(s).replace(/[&<>"]/g,x=>'&#'+x.charCodeAt(0)+';');
const hue=s=>Math.abs([...s].reduce((a,x)=>a*31+x.charCodeAt(0)|0,7))%360;
const av=(n,id)=>`<div class=av style="background:hsl(${hue(id)} 45% 42%)">${esc((n||'?')[0].toUpperCase())}</div>`;
const tm=d=>new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const cid=(a,b)=>[a,b].sort().join('_'),pg=(id,on=1)=>$('#'+id).classList.toggle('on',!!on);
function i18n(){document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));document.querySelectorAll('.lg').forEach(e=>e.textContent=lang=='fa'?'EN':'فا');H.lang=lang;list()}
function lgx(){lang=lang=='fa'?'en':'fa';L.lang=lang;i18n()}
async function usr(id){if(us[id])return;us[id]={name:'…'};try{us[id]=await DB.getDocument(D,U,id);list();chat()}catch{}}
function list(){if(!me)return;const g={};all.forEach(m=>{if(!g[m.chat]||m.$createdAt>g[m.chat].$createdAt)g[m.chat]=m});
$('#rows').innerHTML=Object.values(g).sort((a,b)=>b.$createdAt.localeCompare(a.$createdAt)).map(m=>{const id=m.sender==me.$id?m.peer:m.sender;usr(id);const u=us[id];return`<div class=r data-id="${id}">${av(u.name,id)}<div><b>${esc(u.name)}</b><span>${esc(m.text)}</span></div><time>${tm(m.$createdAt)}</time></div>`}).join('')||`<p class=em>${t('e')}</p>`}
function chat(){if(!cur)return;const k=cid(me.$id,cur),u=us[cur]||{name:'…'};$('#cn').textContent=u.name;$('#ca').innerHTML=av(u.name,cur);
$('#mi').innerHTML=[...all.values()].filter(m=>m.chat==k).sort((a,b)=>a.$createdAt.localeCompare(b.$createdAt)).map(m=>`<div class="m ${m.sender==me.$id?'o':''}"><span>${esc(m.text)}</span><i>${tm(m.$createdAt)}${m.fail?' ⚠':''}</i></div>`).join('')}
async function open(id){cur=id;usr(id);chat();pg('chat');try{const r=await DB.listDocuments(D,M,[Q.equal('chat',[cid(me.$id,id)]),Q.orderDesc('$createdAt'),Q.limit(100)]);r.documents.forEach(d=>all.set(d.$id,d));chat()}catch{}}
function back(){$('#in').blur();pg('chat',0);cur=null;list()}
async function nc(){pg('newc');try{(await DB.listDocuments(D,U,[Q.limit(100)])).documents.forEach(d=>us[d.$id]=d)}catch{}ncr()}
function ncr(){const q=$('#q').value.toLowerCase();$('#ct').innerHTML=Object.values(us).filter(u=>u.$id&&u.$id!=me.$id&&((u.name||'')+(u.username||'')).toLowerCase().includes(q)).map(u=>`<div class=r data-id="${u.$id}">${av(u.name,u.$id)}<div><b>${esc(u.name)}</b><span>${esc(u.username||'')}</span></div></div>`).join('')}
$('#rows').onclick=e=>{const r=e.target.closest('.r');r&&open(r.dataset.id)};
$('#ct').onclick=e=>{const r=e.target.closest('.r');if(r){open(r.dataset.id);setTimeout(()=>pg('newc',0),250)}};
async function send(){const x=$('#in').value.trim();if(!x)return;$('#in').value='';fit();
const d={sender:me.$id,peer:cur,chat:cid(me.$id,cur),text:x},f={...d,$id:'t'+Date.now(),$createdAt:new Date().toISOString()};all.set(f.$id,f);chat();list();
try{const r=await DB.createDocument(D,M,ID.unique(),d,[P.read(R.user(me.$id)),P.read(R.user(cur)),P.update(R.user(me.$id)),P.delete(R.user(me.$id))]);all.delete(f.$id);all.set(r.$id,r)}catch{f.fail=1}chat();list()}
function fit(){const a=$('#in');a.style.height='auto';a.style.height=Math.min(a.scrollHeight,120)+'px';$('#sd').disabled=!a.value.trim()}
$('#in').oninput=fit;
const vv=visualViewport,kb=h=>H.style.setProperty('--kb',h+'px');
$('#in').onfocus=()=>kb(+L.kb||innerHeight*.35);$('#in').onblur=()=>kb(0);
vv.onresize=vv.onscroll=()=>{$('#app').style.transform=`translateY(${vv.offsetTop}px)`;const h=innerHeight-vv.height-vv.offsetTop;if(document.activeElement==$('#in')&&h>120){L.kb=h|0;kb(h)}};
async function enter(a){const id=a.$id;try{me=await DB.getDocument(D,U,id)}catch{me=await DB.createDocument(D,U,id,{name:a.name||(a.email?a.email.split('@')[0]:'Guest '+id.slice(-4)),username:a.email?a.email.split('@')[0]:''},[P.read(R.users()),P.update(R.user(id)),P.delete(R.user(id))])}
us[id]=me;pg('list');pg('auth',0);
try{(await DB.listDocuments(D,M,[Q.orderDesc('$createdAt'),Q.limit(100)])).documents.forEach(d=>all.set(d.$id,d))}catch{}
list();c.subscribe(`databases.${D}.collections.${M}.documents`,r=>{if(r.events.some(e=>/\.create$/.test(e))){all.set(r.payload.$id,r.payload);list();chat()}})}
async function go(g){$('#er').textContent='';try{
if(g)await A.createAnonymousSession();
else{let u=$('#u').value.trim().toLowerCase();const p=$('#p').value;if(!u.includes('@'))u+='@m.app';
try{await A.createEmailPasswordSession(u,p)}catch(e){if(e.code!=401)throw e;await A.create(ID.unique(),u,p,u.split('@')[0]);await A.createEmailPasswordSession(u,p)}}
enter(await A.get())}catch(e){$('#er').textContent=e.message}}
i18n();A.get().then(enter,()=>{});
</script></body></html>
