<style>

<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
<script>
const $=s=>document.querySelector(s),L=localStorage,D='msg',M='messages',U='users',H=document.documentElement;
const T={fa:{ti:'پیام‌رسان',u:'ایمیل یا نام کاربری',p:'رمز عبور',go:'ورود / ثبت‌نام',g:'ورود مهمان',ed:'ویرایش',ch:'گفتگوها',co:'مخاطبین',se:'تنظیمات',s:'جستجو',m:'پیام',nm:'پیام جدید',ng:'گروه جدید',nk:'مخاطب جدید',nl:'کانال جدید',ls:'آخرین بازدید به‌تازگی',cx:'لغو',em:'هنوز گفتگویی نیست'},
en:{ti:'Messenger',u:'Email or username',p:'Password',go:'Sign in / Sign up',g:'Continue as guest',ed:'Edit',ch:'Chats',co:'Contacts',se:'Settings',s:'Search',m:'Message',nm:'New Message',ng:'New Group',nk:'New Contact',nl:'New Channel',ls:'last seen recently',cx:'Cancel',em:'No chats yet'}};
const c=new Appwrite.Client().setEndpoint('https://fra.cloud.appwrite.io/v1').setProject('6aecbdce0036439c36ca');
const A=new Appwrite.Account(c),DB=new Appwrite.Databases(c),{ID,Query:Q,Permission:P,Role:R}=Appwrite;
let lang=L.lang||'fa',me,cur,all=new Map,us={};const sn=JSON.parse(L.sn||'{}');
const t=k=>T[lang][k],esc=s=>String(s).replace(/[&<>"]/g,x=>'&#'+x.charCodeAt(0)+';'),fm=x=>x>999?(x/1e3).toFixed(1)+'K':x;
const hue=s=>Math.abs([...s].reduce((a,x)=>a*31+x.charCodeAt(0)|0,7))%360;
const av=(n,id)=>{const h=hue(id);return`<div class=av style="background:linear-gradient(hsl(${h} 60% 58%),hsl(${h} 60% 42%))">${esc((n||'?')[0].toUpperCase())}</div>`};
const tm=d=>new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
const ft=d=>{const a=new Date(d),n=new Date();return a.toDateString()==n.toDateString()?tm(d):(n-a)/864e5<6?a.toLocaleDateString(lang,{weekday:'short'}):String(a.getMonth()+1).padStart(2,0)+'/'+String(a.getDate()).padStart(2,0)};
const cid=(a,b)=>[a,b].sort().join('_'),pg=(id,on=1)=>$('#'+id).classList.toggle('on',!!on);
$('#ms').style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170' fill='none' stroke='#2a1d40' stroke-width='1.6' stroke-linecap='round'><circle cx='28' cy='28' r='9'/><path d='M96 20l4 9 10 1-8 6 3 10-9-6-9 6 3-10-8-6 10-1z'/><path d='M135 92c10-13 24 6 12 14s-27-4-22-14'/><path d='M30 120q10-14 20 0t20 0'/><path d='M105 142h18M114 133v18'/><circle cx='146' cy='30' r='4'/><path d='M22 150l12-12 6 6-12 12z'/><path d='M70 70c8-8 18 2 10 10s-18 0-10-10z'/></svg>")}")`;
function i18n(){document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));document.querySelectorAll('.lg').forEach(e=>e.textContent=lang=='fa'?'EN':'فا');H.lang=lang;list();chat()}
function lgx(){lang=lang=='fa'?'en':'fa';L.lang=lang;i18n()}
async function usr(id){if(us[id])return;us[id]={name:'…'};try{us[id]=await DB.getDocument(D,U,id);list();chat()}catch{}}
async function lu(){if(lu.d)return;lu.d=1;try{(await DB.listDocuments(D,U,[Q.limit(200)])).documents.forEach(d=>us[d.$id]=d)}catch{lu.d=0}}
function grp(){const g={};all.forEach(m=>{const x=g[m.chat]||(g[m.chat]={m,n:0});if(m.$createdAt>x.m.$createdAt)x.m=m;if(m.sender!=me.$id&&m.$createdAt>(sn[m.chat]||''))x.n++});return g}
function bd(){const g=grp(),k=cur&&cid(me.$id,cur);let n=0,o=0;for(const i in g){n+=g[i].n;if(i!=k)o+=g[i].n}$('#tbd').textContent=fm(n);$('#tbd').hidden=!n;$('#bb').textContent=fm(o);$('#bb').hidden=!o}
function list(){if(!me)return;$('#rows').innerHTML=Object.values(grp()).sort((a,b)=>b.m.$createdAt.localeCompare(a.m.$createdAt)).map(({m,n})=>{const id=m.sender==me.$id?m.peer:m.sender;usr(id);const u=us[id];return`<div class=r data-id="${id}">${av(u.name,id)}<div class=b><div class=l><b>${esc(u.name)}</b><time>${ft(m.$createdAt)}</time></div><div class=l><span>${esc(m.text)}</span>${n?`<em class=bg>${fm(n)}</em>`:''}</div></div></div>`}).join('')||`<p class=em>${t('em')}</p>`;bd()}
function chat(){if(!cur)return;const k=cid(me.$id,cur),u=us[cur]||{name:'…'},a=[...all.values()].filter(m=>m.chat==k).sort((x,y)=>x.$createdAt.localeCompare(y.$createdAt));
$('#cn').textContent=u.name;$('#ca').innerHTML=av(u.name,cur);
const li=a.filter(m=>m.sender!=me.$id).pop();if(li){sn[k]=li.$createdAt;L.sn=JSON.stringify(sn)}
let h='',pd='';a.forEach((m,i)=>{const d=new Date(m.$createdAt).toDateString(),n=a[i+1],o=m.sender==me.$id;
if(d!=pd){h+=`<div class=dt>${new Date(m.$createdAt).toLocaleDateString(lang,{month:'long',day:'numeric',year:'numeric'})}</div>`;pd=d}
const tl=!n||n.sender!=m.sender||new Date(n.$createdAt).toDateString()!=d;
h+=`<div class="m${o?' o':''}${tl?' t':''}"><span class=x>${esc(m.text)}</span><i>${tm(m.$createdAt)}${o?(m.fail?' !':m.$id[0]=='t'?' ◷':' ✓'):''}</i></div>`});
$('#mi').innerHTML=h;bd()}
async function open(id){cur=id;usr(id);chat();pg('chat');try{const r=await DB.listDocuments(D,M,[Q.equal('chat',[cid(me.$id,id)]),Q.orderDesc('$createdAt'),Q.limit(100)]);r.documents.forEach(d=>all.set(d.$id,d));chat()}catch{}}
function back(){$('#in').blur();pg('chat',0);cur=null;list()}
function ur(q,g){q=q.toLowerCase();let h='',p='';Object.values(us).filter(u=>u.$id&&u.$id!=me.$id&&((u.name||'')+(u.username||'')).toLowerCase().includes(q)).sort((x,y)=>x.name.localeCompare(y.name)).forEach(u=>{const z=/[a-z]/i.test(u.name[0])?u.name[0].toUpperCase():'#';if(g&&z!=p){h+=`<div class=lt>${z}</div>`;p=z}h+=`<div class="r c" data-id="${u.$id}">${av(u.name,u.$id)}<div class=b><b>${esc(u.name)}</b><span class=s2>${esc(!g&&u.username?'@'+u.username:t('ls'))}</span></div></div>`});return h}
async function nc(){pg('newc');await lu();ncr()}
function ncr(){$('#ul').innerHTML=ur($('#q').value.trim(),1);$('#ix').innerHTML=[...$('#ul').querySelectorAll('.lt')].map(e=>`<i>${e.textContent}</i>`).join('')}
function sx(on){$('#list').classList.toggle('sx',on);if(on)lu().then(sr);else{$('#sq').value='';$('#sq').blur()}}
function sr(){$('#sres').innerHTML=ur($('#sq').value.trim(),0)}
$('#sq').onfocus=()=>sx(1);
const op=e=>{const r=e.target.closest('.r[data-id]');r&&open(r.dataset.id)};
$('#rows').onclick=op;$('#sres').onclick=e=>{op(e);setTimeout(()=>sx(0),250)};$('#ct').onclick=e=>{op(e);setTimeout(()=>pg('newc',0),250)};
$('#ms').onscroll=e=>$('#dn').classList.toggle('on',e.target.scrollTop<-300);
async function send(){const x=$('#in').value.trim();if(!x)return;$('#in').value='';fit();
const d={sender:me.$id,peer:cur,chat:cid(me.$id,cur),text:x},f={...d,$id:'t'+Date.now(),$createdAt:new Date().toISOString()};all.set(f.$id,f);chat();list();
try{const r=await DB.createDocument(D,M,ID.unique(),d,[P.read(R.user(me.$id)),P.read(R.user(cur)),P.update(R.user(me.$id)),P.delete(R.user(me.$id))]);all.delete(f.$id);all.set(r.$id,r)}catch{f.fail=1}chat();list()}
function fit(){const a=$('#in');a.style.height='auto';a.style.height=Math.min(a.scrollHeight,120)+'px';$('#sd').classList.toggle('go',!!a.value.trim())}
